[project]
name = "anansidata-agent-plugin"
version = "0.1.0"
description = "Anansi macro data MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.14",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
apps = ["fastmcp[apps]"]

[project.scripts]
anansidata-agent-plugin = "anansi_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anansi_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
